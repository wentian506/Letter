<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Best of Luck for Your Exams</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@600;800&display=swap">
<style>
:root{--s1:#ffd9a0;--s2:#8fa8ff;--on:#1d2a4d;--paper:#fffaf0;--ink:#1d2a4d;--sub:#6b5a45;--track:#e9dfc8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--s1:#2a1b5e;--s2:#090d26;--on:#f6f1e1}}
:root[data-theme="dark"]{--s1:#2a1b5e;--s2:#090d26;--on:#f6f1e1}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--on);font-family:Nunito,system-ui,sans-serif;background:linear-gradient(180deg,var(--s2),var(--s1));overflow-x:hidden}
.sky{position:fixed;inset:0;pointer-events:none}
.sky i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.sky b{position:absolute;top:12%;left:-10%;width:120px;height:2px;background:linear-gradient(90deg,transparent,#fff);transform:rotate(25deg);opacity:0;animation:shoot 7s 2s infinite}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(25deg)}4%{opacity:1}14%{opacity:0;transform:translate(70vw,35vw) rotate(25deg)}100%{opacity:0}}
.bars i{position:fixed;left:0;right:0;height:11vh;background:#000;z-index:20;transition:transform 1.2s ease}
.bt{top:0}.bb{bottom:0}
.bars.off .bt{transform:translateY(-100%)}.bars.off .bb{transform:translateY(100%)}
.scene{position:relative;min-height:100vh;display:grid;place-items:center;padding:20px}
.scene>*{grid-area:1/1}
.hand{font-family:Caveat,cursive;font-weight:600}
.intro{align-self:start;margin-top:22vh;font-size:clamp(30px,8vw,44px);text-align:center;animation:fin 2s ease both}
@keyframes fin{from{opacity:0;transform:translateY(14px);letter-spacing:6px}to{opacity:1;transform:none}}
.hint{align-self:end;margin-bottom:20vh;font-weight:800;animation:blink 1.6s 2s infinite both;opacity:0}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
.env{position:relative;width:300px;height:200px;perspective:900px;cursor:pointer;filter:drop-shadow(0 25px 30px rgba(0,0,0,.4));animation:drop 1.6s cubic-bezier(.2,1.3,.4,1) both,float 4s 1.6s ease-in-out infinite;transition:transform 1s ease-in,opacity .9s,filter .9s;outline:0}
@keyframes drop{from{transform:translateY(-70vh) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
@keyframes float{50%{transform:translateY(-10px)}}
.env:focus-visible{outline:3px solid #ffb800;outline-offset:10px}
.back{position:absolute;inset:0;background:#d99b3c;border-radius:8px}
.mini{position:absolute;left:18px;right:18px;top:16px;height:170px;background:var(--paper);border-radius:6px;z-index:2;display:grid;place-content:center;text-align:center;color:#1d2a4d;font-family:Caveat,cursive;font-size:30px;transition:transform 1s cubic-bezier(.3,.9,.3,1.1);box-shadow:0 0 0 rgba(255,200,80,0)}
.mini small{font-size:22px;color:#ef476f}
.front{position:absolute;inset:0;z-index:3;background:#f0c06a;clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%);border-radius:8px}
.flap{position:absolute;left:0;right:0;top:0;height:55%;z-index:4;background:#e5ac4f;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s ease,z-index 0s;backface-visibility:visible}
.seal{position:absolute;left:50%;top:44%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;z-index:5;background:radial-gradient(circle at 35% 30%,#ff6b8a,#b3173f);color:#fff;display:grid;place-items:center;font-size:24px;box-shadow:0 4px 10px rgba(0,0,0,.4);animation:beat 1.2s infinite;transition:opacity .3s}
@keyframes beat{50%{transform:scale(1.14)}}
.env.open .flap{transform:rotateX(180deg);z-index:1;transition:transform .8s ease,z-index 0s .35s;filter:brightness(.85)}
.env.open .seal{opacity:0;animation:none}
.env.open{animation:none}
.env.rise .mini{transform:translateY(-120px);box-shadow:0 0 60px 14px rgba(255,200,80,.8)}
.env.go{transform:scale(2.6);opacity:0;filter:blur(8px)}
.card{width:min(560px,100%);background:var(--paper);color:var(--ink);border-radius:26px;padding:34px 26px 26px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.4);opacity:0;transform:scale(.55) translateY(40px) rotate(-3deg);filter:blur(10px);pointer-events:none;transition:all 1.1s cubic-bezier(.2,.9,.3,1.1)}
.card.show{opacity:1;transform:none;filter:none;pointer-events:auto}
.slot{position:absolute;left:50%;top:-30px;margin-left:-30px;font-size:60px;line-height:1;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3))}
.card{position:relative}
.slot.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25) rotate(-8deg)}}
h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(32px,8vw,46px);margin:14px 0 2px;letter-spacing:-.5px;background:linear-gradient(90deg,#3b6cf6,#ef476f,#f5a300);-webkit-background-clip:text;background-clip:text;color:transparent}
.dear{font-size:25px;color:var(--sub);min-height:1.3em;margin:0 0 16px}
.bar{position:relative;height:14px;background:var(--track);border-radius:99px;margin:10px 0 6px}
.fill{position:relative;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#3b6cf6,#18b27a,#ffb800);transition:width .7s cubic-bezier(.2,.9,.3,1.2)}
.fill::after{content:"\1F680";position:absolute;right:-12px;top:-15px;font-size:22px;transform:rotate(45deg)}
.meta{display:flex;justify-content:space-between;font-weight:800;font-size:14px;color:var(--sub);margin-bottom:12px}
.area{position:relative;min-height:190px;display:grid;place-items:center}
.note{position:absolute;inset:6px 4px;display:grid;place-items:center;padding:18px 26px 18px 44px;background:repeating-linear-gradient(transparent 0 31px,#cfe0ff 31px 32px),#fff;border-left:3px solid #ff9db2;border-radius:6px;box-shadow:0 8px 20px rgba(29,42,77,.18);font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(21px,5.4vw,27px);line-height:1.3;animation:emerge .9s cubic-bezier(.2,1.2,.35,1) both}
@keyframes emerge{from{opacity:0;transform:translateY(-120px) scale(.15) rotate(-18deg)}60%{opacity:1}to{opacity:1;transform:rotate(-1.2deg)}}
.note.y{animation:oy .7s ease-in forwards}.note.n{animation:on .7s ease-in forwards}
@keyframes oy{to{opacity:0;transform:translate(120%,-40px) rotate(24deg);background:#d9f7e8}}
@keyframes on{to{opacity:0;transform:translate(-120%,-40px) rotate(-24deg);background:#ffe1e8}}
.btns{display:flex;gap:14px;justify-content:center;margin-top:16px}
button{font:inherit;font-weight:800;font-size:19px;border:0;border-radius:18px;padding:14px 0;width:140px;cursor:pointer;color:#fff;transition:transform .15s,filter .15s;touch-action:manipulation}
button:hover{transform:translateY(-3px);filter:brightness(1.08)}
button:active{transform:scale(.95)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
button:disabled{opacity:.5;pointer-events:none}
.yes{background:#18b27a;box-shadow:0 6px 0 #0e8559}.no{background:#ef476f;box-shadow:0 6px 0 #b82f52}
.again{background:#3b6cf6;box-shadow:0 6px 0 #2447b5;width:auto;padding:14px 30px;margin-top:16px}
.fb{min-height:1.5em;margin-top:14px;font-weight:800;color:var(--sub)}
.final{text-align:center;animation:emerge .9s cubic-bezier(.2,1.2,.35,1) both}
.final .big{font-size:64px;margin:0;animation:beat 1.2s infinite}
.final .sc{font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:800;margin:4px 0 8px}
.final p{margin:0;line-height:1.5;color:var(--sub);font-size:17px;min-height:4.5em}
.map{position:relative;max-height:0;opacity:0;overflow:hidden;width:100%;border-radius:10px;background:radial-gradient(circle at 20% 20%,#f3deae,#dcb978 80%);box-shadow:inset 0 0 30px rgba(110,60,20,.55);transition:max-height 1.6s ease,opacity .8s,margin .8s}
.map.show{max-height:230px;opacity:1;margin:16px auto 0}
.map::before,.map::after{content:"";position:absolute;left:0;right:0;height:12px;background:linear-gradient(#8a5a2b,#c99a5b,#8a5a2b);z-index:2}
.map::before{top:0}.map::after{bottom:0}
.map svg{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.mt{position:relative;padding:30px 16px;font-family:Caveat,cursive;font-weight:600;font-size:27px;color:#4a2a10;line-height:1.25;text-align:center}
.mt b{font-size:34px;color:#b3173f}
.page2{position:fixed;inset:0;z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle,rgba(30,20,60,.9),rgba(4,4,14,.97));visibility:hidden;opacity:0;transition:opacity 1s,visibility 0s 1s}
.page2.show{visibility:visible;opacity:1;transition:opacity 1s}
.page2 .map{max-width:540px}
.page2 .map.show{max-height:380px;transition:max-height 2.2s ease,opacity .8s}
.page2 .mt{font-size:clamp(30px,8vw,42px);padding:56px 20px}
.page2 .mt b{font-size:clamp(38px,10vw,54px)}
.page2 .again{margin-top:26px}
canvas{position:fixed;inset:0;pointer-events:none;z-index:15}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iterations-count:1!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="sky" id="sky"><b></b></div>
<canvas id="c"></canvas>
<div class="page2" id="page2"></div>
<div class="bars" id="bars"><i class="bt"></i><i class="bb"></i></div>
<main class="scene" id="scene">
 <div class="intro hand" id="intro">A letter just for you…</div>
 <div class="env" id="env" role="button" tabindex="0" aria-label="Open the letter">
  <div class="back"></div>
  <div class="mini">Dear Champion</div>
  <div class="front"></div><div class="flap"></div><div class="seal">❤</div>
 </div>
 <div class="hint" id="hint">Tap the seal to open</div>
 <section class="card" id="card">
  <div class="slot" id="slot">\u2709\uFE0F</div>
  <h1>Best of Luck!</h1>
  <p class="dear hand" id="dear"></p>
  <div class="bar"><div class="fill" id="f"></div></div>
  <div class="meta"><span id="n">&nbsp;</span><span id="p"></span></div>
  <div class="area" id="area"></div>
  <div class="btns" id="btns"><button class="yes" data-a="1" disabled>Yes</button><button class="no" data-a="0" disabled>No</button></div>
  <div class="fb" id="fb" aria-live="polite"></div>
 </section>
</main>
<script>
// fix escaped unicode in static HTML text
document.getElementById("intro").textContent="A letter just for you…";
document.querySelector(".mini").innerHTML="Dear Champion";
document.querySelector(".seal").textContent="❤";
document.getElementById("slot").textContent="\u2709\uFE0F";
var $=function(i){return document.getElementById(i)};
var Qs=["Have you already done everything you can, at your best?","Have you eaten already?","Do you know your exam timing?","Have you practised past papers?","Do you believe you can do this?"];
var Y=["That\u2019s the spirit!","Fuel for the brain!","Plan locked in!","Practice makes perfect!","That belief is half the win!"];
var N=["No worries, give your best today!","Grab a healthy meal soon!","Check it once, you\u2019ve got this!","Start with one paper today.","Say it out loud: I can do this!"];
var i=0,yes=0,busy=true,cur=null;
// stars
var sky=$("sky");for(var k=0;k<70;k++){var s=document.createElement("i");s.style.cssText="left:"+Math.random()*100+"%;top:"+Math.random()*100+"%;animation-delay:"+Math.random()*3+"s;transform:scale("+(.5+Math.random())+")";sky.appendChild(s)}
// particles
var cv=$("c"),cx=cv.getContext("2d"),P=[],run=false,pal=["#ffb800","#3b6cf6","#ef476f","#18b27a","#ffffff"];
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener("resize",size);
function loop(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(function(p){return p.l>0});
 P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.l--;cx.globalAlpha=Math.max(p.l/p.m,0);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s*p.h)});
 if(P.length)requestAnimationFrame(loop);else run=false}
function add(a){P=P.concat(a);if(!run){run=true;loop()}}
function burst(x,y,n){var c=pal[Math.floor(Math.random()*4)],a=[];for(var k=0;k<(n||60);k++){var t=Math.random()*6.283,v=2+Math.random()*5;a.push({x:x,y:y,vx:Math.cos(t)*v,vy:Math.sin(t)*v,g:.06,l:75,m:75,s:3,h:1,c:c})}add(a)}
function rain(){var a=[];for(var k=0;k<130;k++)a.push({x:Math.random()*cv.width,y:-20,vx:Math.random()*2-1,vy:2+Math.random()*3,g:.02,l:240,m:240,s:6+Math.random()*5,h:.6,c:pal[k%5]});add(a)}
function type(el,t,cb){var j=0;(function f(){el.textContent=t.slice(0,++j);if(j<t.length)setTimeout(f,35);else if(cb)cb()})()}
// cinematic open
var env=$("env"),card=$("card"),started=false;
function open(){if(started)return;started=true;$("hint").style.display="none";$("intro").style.opacity="0";
 env.classList.add("open");
 setTimeout(function(){env.classList.add("rise");burst(innerWidth/2,innerHeight/2,50)},800);
 setTimeout(function(){env.classList.add("go");$("bars").classList.add("off")},1900);
 setTimeout(function(){card.classList.add("show");burst(innerWidth/2,innerHeight/3,40)},2300);
 setTimeout(function(){type($("dear"),"Dear Champion, your hard work is about to shine \u2728",begin)},3300);
}
env.addEventListener("click",open);
env.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}});
// intro + bars
setTimeout(function(){$("hint").style.opacity=1},100);
// quiz
function begin(){setTimeout(next,500)}
function next(){
 $("n").textContent="Question "+(i+1)+" of "+Qs.length;
 $("p").textContent=Math.round(i/Qs.length*100)+"%";
 var d=document.createElement("div");d.className="note";d.textContent=Qs[i];$("area").appendChild(d);cur=d;
 var s=$("slot");s.classList.remove("bump");void s.offsetWidth;s.classList.add("bump");
 setTimeout(function(){busy=false;setBtns(false)},700);
}
function setBtns(v){var b=document.querySelectorAll("#btns button");for(var k=0;k<b.length;k++)b[k].disabled=v}
$("btns").addEventListener("click",function(e){
 var b=e.target.closest("button");if(!b||busy)return;busy=true;setBtns(true);
 var a=b.dataset.a==="1";if(a)yes++;
 cur.className="note "+(a?"y":"n");
 $("fb").textContent=(a?Y:N)[i];
 i++;$("f").style.width=(i/Qs.length*100)+"%";$("p").textContent=Math.round(i/Qs.length*100)+"%";
 var old=cur;setTimeout(function(){old.remove()},750);
 setTimeout(function(){if(i>=Qs.length)finish();else{$("fb").textContent="";next()}},900);
});
function finish(){
 var pct=Math.round(yes/Qs.length*100);
 var m=pct>=80?["\uD83C\uDFC6","You\u2019re fully prepared!","Walk in with a smile. Success is already yours."]:
 pct>=50?["\uD83D\uDE80","You\u2019re almost there!","A little revision and good sleep will take you to the top."]:
 ["\uD83D\uDCAA","You\u2019ve got the spirit!","Start small today. Every page you read counts. We believe in you!"];
 $("btns").style.display="none";$("fb").textContent="";$("n").textContent="All done";$("p").textContent="100%";
 $("area").innerHTML='<div class="final"><p class="big">'+m[0]+'</p><div class="sc">'+yes+' of '+Qs.length+' ready \u2022 '+pct+'%</div><p class="hand" style="font-size:25px" id="msg"></p><div class="map" id="map"><svg viewBox="0 0 300 100" preserveAspectRatio="none"><path d="M14 78 C60 10 100 100 150 50 S240 10 270 62" fill="none" stroke="#8a4b1f" stroke-width="3" stroke-dasharray="6 7" stroke-linecap="round"/><text x="262" y="84" font-size="26" fill="#c1121f">\u2716</text></svg><div class="mt">Make sure to sleep on time.<br>Good Night \uD83C\uDF19<br><b>Little Champ</b></div></div><button class="again" id="again">Play again</button></div>';
 var s=$("slot");s.classList.remove("bump");void s.offsetWidth;s.classList.add("bump");
 type($("msg"),m[1]+" "+m[2]+" Stay calm, trust yourself, and do your best. Good luck! \uD83C\uDF40",function(){setTimeout(function(){var p=$("page2");p.appendChild($("map"));p.appendChild($("again"));p.classList.add("show");setTimeout(function(){$("map").classList.add("show");burst(innerWidth/2,innerHeight/2,50)},900)},2200)});
 rain();for(var k=0;k<7;k++)setTimeout(function(){burst(innerWidth*(.15+Math.random()*.7),innerHeight*(.1+Math.random()*.4))},k*450);
 $("again").onclick=function(){$("page2").classList.remove("show");setTimeout(function(){$("page2").innerHTML=""},1000);i=0;yes=0;busy=true;$("area").innerHTML="";$("btns").style.display="flex";$("f").style.width="0";next()};
}
</script>
</body>
</html>
